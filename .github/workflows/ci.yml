name: Site CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
      - run: npm ci
      - name: Validate extracted catalogue
        run: npm run test:data
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Confirm the copied STUDY site is excluded
        run: npm run check:dist
      - name: Check built-page asset links
        run: npm run check:links
      - name: Install browser for responsive and accessibility checks
        run: npx playwright install --with-deps chromium
      - name: Phone/desktop screenshot and accessibility checks
        shell: bash
        run: |
          mkdir -p test-results
          set +e
          npm run test:e2e 2>&1 | tee test-results/e2e.log
          result=${PIPESTATUS[0]}
          if [[ "$result" -ne 0 ]]; then
            echo "::group::Playwright failure details"
            tail -n 80 test-results/e2e.log | while IFS= read -r line; do
              escaped="${line//'%'/'%25'}"
              escaped="${escaped//$'\r'/'%0D'}"
              escaped="${escaped//':'/'%3A'}"
              escaped="${escaped//','/'%2C'}"
              printf '::error title=Playwright failure::%s\n' "$escaped"
            done
            echo "::endgroup::"
          fi
          exit "$result"
      - name: Upload browser diagnostics on failure
        if: failure() && hashFiles('test-results/**') != ''
        uses: actions/upload-artifact@v7.0.2
        with:
          name: site-e2e-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Package downloadable preview
        if: always()
        run: |
          if [ -d dist ]; then
            (cd dist && zip -qr ../site-preview.zip .)
          fi
      - name: Upload site-preview artifact
        if: always() && hashFiles('site-preview.zip') != ''
        uses: actions/upload-artifact@v7.0.2
        with:
          name: site-preview
          path: site-preview.zip
          if-no-files-found: error
          retention-days: 14
