name: Site CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # Only used to publish the browser-failure digest as a PR comment (the agent
  # sandbox cannot fetch Actions logs or artifacts, and annotations are capped).
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Validate extracted catalogue
        run: npm run test:data
      - name: Confirm generated Firestore rules match the catalogue
        run: npm run check:rules
      - name: Unit tests
        run: npm test
      - name: Production build (emulator identifiers)
        env:
          VITE_FIREBASE_USE_EMULATOR: 'true'
          VITE_FIREBASE_PROJECT_ID: demo-dsa-archive
          VITE_FIREBASE_EMULATOR_HOST: 127.0.0.1
        run: npm run build
      - name: Confirm the copied STUDY site is excluded
        run: npm run check:dist
      - name: Check built-page asset links
        run: npm run check:links
      - name: Enforce bundle, PWA and Spark transfer budgets
        run: npm run check:budgets
      - name: Install browser for responsive and accessibility checks
        run: npx playwright install --with-deps chromium
      - name: Emulator rules tests + phone/desktop browser acceptance
        env:
          GCLOUD_PROJECT: demo-dsa-archive
          PLAYWRIGHT_EMULATOR: '1'
        run: |
          set -o pipefail
          npm run test:emulator 2>&1 | tee test-output.log
      - name: Production build (live dsa-archive public config) + budget verification
        run: |
          npm run build
          npm run check:dist
          npm run check:links
          npm run check:budgets
      - name: Summarise emulator/browser failure as annotations
        # The agent sandbox cannot download Actions logs or artifacts (the blob
        # host is outside its allowlist), so each failure block is re-emitted as
        # a check-run annotation: one annotation per failing step, with context.
        if: failure() && hashFiles('test-output.log') != ''
        run: |
          python3 - <<'PY'
          import re
          ansi = re.compile(r'\x1b\[[0-9;]*[A-Za-z]')
          try:
              raw = open('test-output.log', encoding='utf-8', errors='replace').read()
          except OSError:
              raise SystemExit(0)
          lines = [ansi.sub('', line).rstrip() for line in raw.splitlines()]
          triggers = re.compile(r'(^not ok |^\s*not ok |✘|Error:|AssertionError|Unhandled|error TS)')
          blocks, seen = [], set()
          for index, line in enumerate(lines):
              if not triggers.search(line):
                  continue
              block = ' | '.join(part.strip() for part in lines[index:index + 14] if part.strip())
              key = block[:120]
              if key in seen:
                  continue
              seen.add(key)
              blocks.append(block[:1400])
          # The runner re-uses annotations, so emit the earliest failures first
          # (reverse chronological) and add a compact "each failure + its own
          # following lines" pass: the summary block only contains test names,
          # never the assertion that failed.
          detail = []
          for index, line in enumerate(lines):
              if '✘' not in line:
                  continue
              following = [part.strip() for part in lines[index + 1:index + 4] if part.strip()]
              detail.append(' | '.join([line.strip(), *following])[:600])
          for block in detail[:10]:
              print('::error::' + block.replace('%', '%25'))
          for block in reversed(blocks[:6]):
              print('::error::' + block.replace('%', '%25'))
          PY
          exit 0
      - name: Publish browser failure digest on the pull request
        # The sandbox cannot download Actions logs or artifacts (the blob host is
        # outside its allowlist) and check-run annotations are capped, so the
        # failing assertions are re-published where they can be read: a PR comment.
        if: failure() && github.event_name == 'pull_request' && hashFiles('test-output.log') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY' > failure-digest.md
          import re
          ansi = re.compile(r'\x1b\[[0-9;]*[A-Za-z]')
          raw = open('test-output.log', encoding='utf-8', errors='replace').read()
          lines = [ansi.sub('', line).rstrip() for line in raw.splitlines()]
          # `list` reporter: the run summary first, then one "  N) [chromium] …"
          # block per failure with the assertion, the locator and the call log.
          starts = [i for i, line in enumerate(lines) if re.match(r'^\s+\d+\) \[chromium\]', line)]
          body = lines[starts[0]:] if starts else lines[-250:]
          # Visual-snapshot noise (no baselines exist yet) goes in its own section.
          visual, functional, bucket = [], [], functional
          for line in body:
              if re.match(r'^\s+\d+\) \[chromium\]', line):
                  bucket = visual if 'visual.spec.ts' in line else functional
              elif re.match(r'^\s+\d+\) ', line):
                  bucket = visual  # summary rows at the top of the block
              bucket.append(line)
          shown = [line for line in functional if line.strip()][:450]
          out = ['<!-- failure-digest -->', '## Browser matrix failure digest', '',
                 f'{len(starts)} failing tests · {len(functional)} lines of non-visual detail', '', '```']
          out.extend(shown)
          if len(functional) > len(shown):
              out.append('… truncated')
          out.extend(['```', '', f'Visual baselines pending: {len(visual)} lines (see the artifact).'])
          print('\n'.join(out))
          PY
          if [ -s failure-digest.md ]; then
            # `--edit-last` flags are not accepted on every gh release and made
            # this step fail on its own; editing the existing comment is done
            # explicitly through the API instead.
            COMMENT_ID=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
              --paginate --jq '.[] | select(.body | contains("<!-- failure-digest -->")) | .id' | tail -1)
            if [ -n "$COMMENT_ID" ]; then
              gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$COMMENT_ID" \
                -f body="$(cat failure-digest.md)" > /dev/null
            else
              gh pr comment "${{ github.event.pull_request.number }}" --body-file failure-digest.md
            fi
          fi
      - name: Upload generated visual baselines for review
        if: always() && hashFiles('e2e/__screenshots__/**') != ''
        uses: actions/upload-artifact@v7.0.2
        with:
          name: visual-baselines
          path: e2e/__screenshots__/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload browser diagnostics on failure
        if: failure() && hashFiles('test-results/**') != ''
        uses: actions/upload-artifact@v7.0.2
        with:
          name: site-e2e-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Package downloadable preview
        if: always()
        run: |
          if [ -d dist ]; then
            (cd dist && zip -qr ../site-preview.zip .)
          fi
      - name: Upload site-preview artifact
        if: always() && hashFiles('site-preview.zip') != ''
        uses: actions/upload-artifact@v7.0.2
        with:
          name: site-preview
          path: site-preview.zip
          if-no-files-found: error
          retention-days: 14
