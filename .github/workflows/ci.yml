name: Site CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # Used for the coverage PR comment/body and the browser-failure digest (the
  # agent sandbox cannot fetch Actions logs or artifacts, and annotations are capped).
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CONTENT_AS_OF: '2026-11-03'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Validate extracted catalogue
        run: npm run test:data
      - name: Validate Phase 03 content coverage report
        run: npm run check:content
      - name: Publish content coverage to the run summary
        if: always()
        run: cat docs/content/coverage.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish content coverage on the pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          REPO="${{ github.repository }}"
          NUM="${{ github.event.pull_request.number }}"
          COMMENT_ID=$(gh api "repos/$REPO/issues/$NUM/comments?per_page=100" \
            --jq '.[] | select(.body | startswith("<!-- content-coverage -->")) | .id' 2>/dev/null | tail -1)
          if [ -n "$COMMENT_ID" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$COMMENT_ID" -F body=@docs/content/coverage.md > /dev/null 2>&1
          else
            gh pr comment "$NUM" --body-file docs/content/coverage.md > /dev/null 2>&1
          fi
          exit 0
      - name: Put content coverage summary in the PR body
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          REPO="${{ github.repository }}"
          NUM="${{ github.event.pull_request.number }}"
          gh pr view "$NUM" --repo "$REPO" --json body --jq '.body // ""' > /tmp/pr-body.md 2>/dev/null
          python3 - <<'PY'
          from pathlib import Path
          body = Path('/tmp/pr-body.md').read_text(encoding='utf-8', errors='replace')
          coverage = Path('docs/content/coverage.md').read_text(encoding='utf-8').strip()
          start = '<!-- content-coverage -->'
          end = '<!-- /content-coverage -->'
          block = f'{start}\n\n{coverage}\n\n{end}'
          if start in body and end in body:
              before, remainder = body.split(start, 1)
              _, after = remainder.split(end, 1)
              body = f'{before}{block}{after}'
          else:
              body = f'{body.rstrip()}\n\n{block}\n'
          Path('/tmp/pr-body-updated.md').write_text(body, encoding='utf-8')
          PY
          gh pr edit "$NUM" --repo "$REPO" --body-file /tmp/pr-body-updated.md > /dev/null 2>&1
          echo "coverage summary published to PR body"
          # Publishing is non-blocking; the checked-in report is authoritative.
          exit 0
      - name: Upload content coverage report
        uses: actions/upload-artifact@v7.0.2
        with:
          name: content-coverage
          path: |
            data/content/coverage.json
            docs/content/coverage.md
          if-no-files-found: error
          retention-days: 14
      - name: Confirm generated Firestore rules match the catalogue
        run: npm run check:rules
      - name: Unit tests
        run: npm test
      - name: Production build (emulator identifiers)
        env:
          VITE_FIREBASE_USE_EMULATOR: 'true'
          VITE_FIREBASE_PROJECT_ID: demo-dsa-archive
          VITE_FIREBASE_EMULATOR_HOST: 127.0.0.1
        run: npm run build
      - name: Confirm the copied STUDY site is excluded
        run: npm run check:dist
      - name: Check built-page asset links
        run: npm run check:links
      - name: Enforce bundle, PWA and Spark transfer budgets
        run: npm run check:budgets
      - name: Install browser for responsive and accessibility checks
        run: npx playwright install --with-deps chromium
      - name: Emulator rules tests + phone/desktop browser acceptance
        env:
          GCLOUD_PROJECT: demo-dsa-archive
          PLAYWRIGHT_EMULATOR: '1'
        run: |
          set -o pipefail
          npm run test:emulator 2>&1 | tee test-output.log
      - name: Production build (live dsa-archive public config) + budget verification
        run: |
          npm run build
          npm run check:dist
          npm run check:links
          npm run check:budgets
      - name: Summarise emulator/browser failure as annotations
        # The agent sandbox cannot download Actions logs or artifacts (the blob
        # host is outside its allowlist), so each failure block is re-emitted as
        # a check-run annotation: one annotation per failing step, with context.
        if: failure() && hashFiles('test-output.log') != ''
        run: |
          python3 - <<'PY'
          import re
          ansi = re.compile(r'\x1b\[[0-9;]*[A-Za-z]')
          try:
              raw = open('test-output.log', encoding='utf-8', errors='replace').read()
          except OSError:
              raise SystemExit(0)
          lines = [ansi.sub('', line).rstrip() for line in raw.splitlines()]
          # GitHub caps workflow-command annotations per step. Spend the ten
          # slots on distinct failing Playwright cases with their own assertion
          # context, rather than repeating the reporter's rolling summary rows.
          starts = [i for i, line in enumerate(lines)
                    if re.match(r'^\s*\d+\) \[chromium\]', line)]
          failures = []
          for position, start in enumerate(starts):
              end = starts[position + 1] if position + 1 < len(starts) else len(lines)
              block = [line.strip() for line in lines[start:end]
                       if line.strip() and not line.strip().startswith(('attachment #', 'Usage:', '─'))]
              failures.append(' | '.join(block)[:1800])
          for block in failures[:10]:
              print('::error::' + block.replace('%', '%25'))
          PY
          exit 0
      - name: Publish browser failure digest on the pull request
        # The sandbox cannot download Actions logs or artifacts (the blob host is
        # outside its allowlist) and check-run annotations are capped, so the
        # failing assertions are re-published where they can be read: a PR comment.
        if: failure() && github.event_name == 'pull_request' && hashFiles('test-output.log') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY' > failure-digest.md
          import re
          ansi = re.compile(r'\x1b\[[0-9;]*[A-Za-z]')
          raw = open('test-output.log', encoding='utf-8', errors='replace').read()
          lines = [ansi.sub('', line).rstrip() for line in raw.splitlines()]
          # `list` reporter: the run summary first, then one "  N) [chromium] …"
          # block per failure with the assertion, the locator and the call log.
          starts = [i for i, line in enumerate(lines) if re.match(r'^\s+\d+\) \[chromium\]', line)]
          body = lines[starts[0]:] if starts else lines[-250:]
          # Visual-snapshot noise (no baselines exist yet) goes in its own section.
          visual, functional = [], []
          bucket = functional
          for line in body:
              if re.match(r'^\s+\d+\) \[chromium\]', line):
                  bucket = visual if 'visual.spec.ts' in line else functional
              elif re.match(r'^\s+\d+\) ', line):
                  bucket = visual  # summary rows at the top of the block
              bucket.append(line)
          shown = [line for line in functional if line.strip()][:450]
          out = ['<!-- failure-digest -->', '## Browser matrix failure digest', '',
                 f'{len(starts)} failing tests · {len(functional)} lines of non-visual detail', '', '```']
          out.extend(shown)
          if len(functional) > len(shown):
              out.append('… truncated')
          out.extend(['```', '', f'Visual baselines pending: {len(visual)} lines (see the artifact).'])
          print('\n'.join(out))
          PY
          # Publish, but never fail the run on the publishing itself (the
          # browser result above is the signal this job exists to report).
          set +e
          if [ -s failure-digest.md ]; then
            REPO="${{ github.repository }}"
            NUM="${{ github.event.pull_request.number }}"
            COMMENT_ID=$(gh api "repos/$REPO/issues/$NUM/comments?per_page=100" \
              --jq '.[] | select(.body | startswith("<!-- failure-digest -->")) | .id' 2>/dev/null | tail -1)
            if [ -n "$COMMENT_ID" ]; then
              gh api -X PATCH "repos/$REPO/issues/comments/$COMMENT_ID" -F body=@failure-digest.md > /dev/null 2>&1
            else
              gh pr comment "$NUM" --body-file failure-digest.md 2>&1 | tail -2
            fi
            echo "digest published (comment ${COMMENT_ID:-new})"
          fi
          exit 0
      - name: Upload generated visual baselines for review
        if: always() && hashFiles('e2e/__screenshots__/**') != ''
        uses: actions/upload-artifact@v7.0.2
        with:
          name: visual-baselines
          path: e2e/__screenshots__/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload browser diagnostics on failure
        if: failure() && hashFiles('test-results/**') != ''
        uses: actions/upload-artifact@v7.0.2
        with:
          name: site-e2e-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Package downloadable preview
        if: always()
        run: |
          if [ -d dist ]; then
            (cd dist && zip -qr ../site-preview.zip .)
          fi
      - name: Upload site-preview artifact
        if: always() && hashFiles('site-preview.zip') != ''
        uses: actions/upload-artifact@v7.0.2
        with:
          name: site-preview
          path: site-preview.zip
          if-no-files-found: error
          retention-days: 14
