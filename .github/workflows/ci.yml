name: Site CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Validate extracted catalogue
        run: npm run test:data
      - name: Confirm generated Firestore rules match the catalogue
        run: npm run check:rules
      - name: Unit tests
        run: npm test
      - name: Production build (emulator identifiers)
        env:
          VITE_FIREBASE_USE_EMULATOR: 'true'
          VITE_FIREBASE_PROJECT_ID: demo-dsa-archive
          VITE_FIREBASE_EMULATOR_HOST: 127.0.0.1
        run: npm run build
      - name: Confirm the copied STUDY site is excluded
        run: npm run check:dist
      - name: Check built-page asset links
        run: npm run check:links
      - name: Install browser for responsive and accessibility checks
        run: npx playwright install --with-deps chromium
      - name: Emulator rules tests + phone/desktop browser acceptance
        env:
          GCLOUD_PROJECT: demo-dsa-archive
          PLAYWRIGHT_EMULATOR: '1'
        run: npm run test:emulator
      - name: Upload browser diagnostics on failure
        if: failure() && hashFiles('test-results/**') != ''
        uses: actions/upload-artifact@v7.0.2
        with:
          name: site-e2e-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Package downloadable preview
        if: always()
        run: |
          if [ -d dist ]; then
            (cd dist && zip -qr ../site-preview.zip .)
          fi
      - name: Upload site-preview artifact
        if: always() && hashFiles('site-preview.zip') != ''
        uses: actions/upload-artifact@v7.0.2
        with:
          name: site-preview
          path: site-preview.zip
          if-no-files-found: error
          retention-days: 14
